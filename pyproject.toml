[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "fpr-ff1"
version = "0.1.1"
description = "Format-preserving encryption: NIST SP 800-38G FF1 for Python."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
# GitHub noreply address rather than a corporate mailbox, so the published
# metadata does not expose an employer association (review 00004 LOW-05).
authors = [{ name = "Joseph Lee", email = "joelee@users.noreply.github.com" }]
maintainers = [{ name = "Joseph Lee", email = "joelee@users.noreply.github.com" }]
# No upper bound: a capped requires-python turns into a hard resolution
# failure on future interpreters (3.15 final is scheduled for October 2026),
# which punishes users for our untested matrix.  The classifiers state the
# versions CI actually exercises; the floor is raised as the matrix grows.
requires-python = ">=3.12"
keywords = [
    "ff1",
    "format-preserving-encryption",
    "fpe",
    "nist",
    "sp800-38g",
    "cryptography",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Security :: Cryptography",
    "Typing :: Typed",
]
dependencies = [
    # Floor set to the first release fixing PYSEC-2026-3552 (GHSA-g6cj-pr64-35w5,
    # fixed in 50.0.0); lower floors admit known-vulnerable resolutions and
    # trip downstream security scanners.
    "cryptography>=50.0.0",
]

[project.urls]
Homepage = "https://github.com/joelee/fpr-ff1"
Documentation = "https://github.com/joelee/fpr-ff1/blob/main/README.md"
Repository = "https://github.com/joelee/fpr-ff1"
Issues = "https://github.com/joelee/fpr-ff1/issues"
Changelog = "https://github.com/joelee/fpr-ff1/blob/main/CHANGELOG.md"
Security = "https://github.com/joelee/fpr-ff1/blob/main/SECURITY.md"

[dependency-groups]
dev = [
    "hypothesis>=6.131.0",
    "pre-commit>=4.2.0",
    "pyright>=1.1.400",
    "pytest>=8.4.0",
    "pytest-cov>=6.2.0",
    "ruff>=0.16",
    "ubiq-security-fpe==2.0.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fpr_ff1"]

# Explicit sdist contents (review 00003 L2 / review 00004 LOW-02): without
# this, hatchling ships everything it finds -- agent instructions, planning
# and review documents, editor state, even .opencode/node_modules.  The
# published tarball is code, tests, vectors, and user-facing docs only.
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs/architecture.md",
    "/docs/backlog.md",
    "/docs/configuration.md",
    "/docs/developer-guide.md",
    "/docs/directory-structure.md",
    "/CHANGELOG.md",
    "/SECURITY.md",
    "/justfile",
    "/uv.lock",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = [
    "A",
    "ARG",
    "B",
    "C4",
    "E",
    "F",
    "I",
    "N",
    "PL",
    "PTH",
    "RUF",
    "S",
    "SIM",
    "T20",
    "UP",
    "W",
]
ignore = [
    "PLR0913",
]

[tool.ruff.lint.per-file-ignores]
"src/fpr_ff1/_ff1.py" = ["N806", "PLR2004", "S305"]
"tests/**/*.py" = ["PLR2004", "S101"]
# The timing harness is a CLI tool; printing is its purpose.
"benchmarks/**/*.py" = ["T20"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
# No coverage flags here, deliberately (review 00003 M4): the sdist ships
# the tests, and a bare `pytest` from an unpacked sdist must not fail for a
# downstream packager who has not installed pytest-cov.  The 100% floor is
# enforced by `just coverage` / `just quality` and by CI's explicit flags.
testpaths = ["tests"]
markers = [
    "slow: tests that take more than a few seconds",
]

[tool.coverage.run]
branch = true
source = ["fpr_ff1"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = "warning"
reportPrivateUsage = "warning"
