[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "fpr-ff1"
version = "0.1.1"
description = "Format-preserving encryption: NIST SP 800-38G FF1 for Python."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
# Upper bound matches the tested CI matrix exactly (3.12, 3.13, 3.14).  Raising
# it is a release-time action once a new Python is in the matrix and green.
requires-python = ">=3.12,<3.15"
keywords = [
    "ff1",
    "format-preserving-encryption",
    "fpe",
    "nist",
    "sp800-38g",
    "cryptography",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Security :: Cryptography",
    "Typing :: Typed",
]
dependencies = [
    "cryptography>=44.0.0",
]

[project.urls]
Homepage = "https://github.com/joelee/fpr-ff1"
Repository = "https://github.com/joelee/fpr-ff1"
Issues = "https://github.com/joelee/fpr-ff1/issues"
Changelog = "https://github.com/joelee/fpr-ff1/blob/main/CHANGELOG.md"
Security = "https://github.com/joelee/fpr-ff1/blob/main/SECURITY.md"

[dependency-groups]
dev = [
    "hypothesis>=6.131.0",
    "pre-commit>=4.2.0",
    "pyright>=1.1.400",
    "pytest>=8.4.0",
    "pytest-cov>=6.2.0",
    "ruff>=0.12.0",
    "ubiq-security-fpe==2.0.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fpr_ff1"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = [
    "A",
    "ARG",
    "B",
    "C4",
    "E",
    "F",
    "I",
    "N",
    "PL",
    "PTH",
    "RUF",
    "S",
    "SIM",
    "T20",
    "UP",
    "W",
]
ignore = [
    "PLR0913",
]

[tool.ruff.lint.per-file-ignores]
"src/fpr_ff1/_ff1.py" = ["N806", "PLR2004", "S305"]
"tests/**/*.py" = ["PLR2004", "S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
addopts = "--cov=fpr_ff1 --cov-report=term-missing --cov-fail-under=100"
testpaths = ["tests"]
markers = [
    "slow: tests that take more than a few seconds",
]

[tool.coverage.run]
branch = true
source = ["fpr_ff1"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = "warning"
reportPrivateUsage = "warning"
