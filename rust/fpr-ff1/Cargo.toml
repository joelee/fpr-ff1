[package]
name = "fpr-ff1"
# Kept in lock-step with [project].version in pyproject.toml and with the
# binding crate, in semver form: Cargo cannot parse the PEP 440 spelling
# ("2.0.0rc1"), so a pre-release is written 2.0.0-rc1 here.
# tests/test_contract.py enforces the versions on every CI leg.
version = "2.1.0-rc2"
edition = "2021"
# The minimum supported Rust version (plan 00009 D8): aes 0.9.3 declares
# 1.89, and the core itself needs 1.88 for slice::as_chunks. A build on
# 1.88 is refused ("aes@0.9.3 requires rustc 1.89"); CI tests on 1.89.
rust-version = "1.89"
description = "NIST SP 800-38G FF1 format-preserving encryption: exact integer arithmetic, conformance-tested against the published vectors."
license = "MIT OR Apache-2.0"
repository = "https://github.com/joelee/fpr-ff1"
homepage = "https://github.com/joelee/fpr-ff1"
documentation = "https://docs.rs/fpr-ff1"
readme = "README.md"
keywords = ["ff1", "fpe", "format-preserving", "encryption", "sp800-38g"]
categories = ["cryptography"]
# Only the crate's own sources and documents; the fixtures stay in the
# repository's tests/vectors/ (see src/test_fixtures.rs).
include = [
    "/src/**/*.rs",
    "/tests/**/*.rs",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
]

[lib]
name = "fpr_ff1"
crate-type = ["rlib"]

[package.metadata.docs.rs]
# Document the public API only: never the hidden `internal` feature.
no-default-features = true
features = []

[features]
# Exposes the unvalidated core, the PRF and block-cipher seams and the
# per-round trace hook as `fpr_ff1::__internal`, for the PyO3 binding and
# the conformance tests only. Not part of the public API and outside the
# semver contract (plan 00009 D10): never enable it in a downstream crate.
internal = []

[dependencies]
num-bigint = "0.5"
num-traits = "0.2"
num-integer = "0.1"
# AES core for the Algorithm 6 PRF and the step 6.iii expansion blocks
# (plan 00003 decision D7, RustCrypto family). Validated against the NIST
# FIPS 197 Appendix C KAT vectors and the Python path's PRF output
# (tests/test_rust_aes_validation.py) before any FF1-level conformance is
# trusted on it. The CBC-MAC itself is a six-line XOR chain over these
# single-block primitives -- more spec-literal than the `cbc` wrapper,
# which would need one concrete instantiation per key size anyway.
aes = "0.9"

[dev-dependencies]
# Reads the shared JSON fixtures in tests/vectors. arbitrary_precision keeps
# the per-round y and c values, which exceed u64, exact.
serde_json = { version = "1", features = ["arbitrary_precision"] }
# Property tests: round trip, length and range preservation, key and tweak
# sensitivity, determinism.
proptest = { version = "1", default-features = false, features = ["std"] }
