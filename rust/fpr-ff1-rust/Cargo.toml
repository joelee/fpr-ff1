[package]
name = "fpr-ff1-rust"
# Kept in lock-step with [project].version in pyproject.toml and with the
# fpr-ff1 crate, in semver form: Cargo cannot parse the PEP 440 spelling
# ("2.0.0rc1" fails with "unexpected character 'r' after patch version
# number"), so a pre-release is written 2.0.0-rc1 here and 2.0.0rc1 there.
# packaging.version.Version reads both as the same release, and
# tests/test_contract.py::test_crate_version_matches_project_version
# enforces the pair on every CI leg.
version = "2.1.0"
edition = "2021"
description = "PyO3 binding of the fpr-ff1 FF1 core, shipped in the fpr-ff1 platform wheels as fpr_ff1._rs."
license = "MIT"
publish = false

[lib]
name = "_fpr_ff1_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
# The core, with its unvalidated entry points: the Python FF1 class validates
# every input before calling in (plan 00003 decision D4).
fpr-ff1 = { path = "../fpr-ff1", features = ["internal"] }
