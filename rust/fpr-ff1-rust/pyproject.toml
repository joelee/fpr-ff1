# Build configuration for the Rust accelerated backend crate (plan 00003
# E2). This file exists so `maturin develop -m Cargo.toml` (just backend-dev)
# treats the crate as a standalone extension project and installs the
# `_fpr_ff1_rs` module into the venv at the top level; without it, maturin
# walks up and finds the repo root's Python pyproject.toml instead, which
# produces a mixed wheel that ships no importable extension.
#
# The Python package's own build (hatchling, pure-Python sdist fallback per
# REQ-19) is configured separately in the repo root pyproject.toml and is
# wired to this crate in STEP-14 (packaging).
[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "fpr-ff1-rust"
version = "0.1.0"
description = "Opt-in Rust accelerated backend for fpr-ff1; never published independently."
requires-python = ">=3.12"