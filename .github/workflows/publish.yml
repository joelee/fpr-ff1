name: Publish

# Publishes to PyPI via Trusted Publishing (OIDC).  No API tokens are stored
# in this repository; configure the publisher at
# https://pypi.org/manage/project/fpr-ff1/settings/publishing/
#
# Release events only -- no workflow_dispatch: a manual dispatch could
# publish from an arbitrary ref without a release or a tag (review 00003 H5 /
# review 00004 MED-02).

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  quality:
    # Never publish something that has not passed the full matrix.
    uses: ./.github/workflows/ci.yml

  publish:
    needs: quality
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/fpr-ff1
    permissions:
      id-token: write # required for Trusted Publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      # The gate's build job already built and twine-checked the
      # distributions.  Publishing a *rebuilt* artifact would mean the
      # artifact sent to PyPI is not byte-for-byte the artifact the gate
      # verified (review 00003 H5 / review 00004 MED-02): download and
      # publish exactly what was tested.  The platform wheels come from the
      # gate's wheel-build job (plan 00003 STEP-14) and are published under
      # the same rule.
      - name: Download gated distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist/

      # Each wheel-build leg uploads under a unique name (wheels-<target>);
      # a pattern download with merge-multiple collects every platform wheel
      # so the release publishes the full decided set, not a single leg.
      - name: Download gated platform wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          path: dist/
          merge-multiple: true

      # Guard: the release tag must match the project version, so a release
      # cut from a stale ref cannot publish mislabelled artifacts.
      - name: Verify tag matches project version
        run: |
          project_version="$(uv run --no-sync python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "${GITHUB_REF_NAME}" != "v${project_version}" ]; then
            echo "release tag ${GITHUB_REF_NAME} does not match project version ${project_version}" >&2
            exit 1
          fi

      - name: Check metadata
        run: uvx twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  # crates.io, by Trusted Publishing (plan 00009 STEP-11, REQ-12): an OIDC
  # token exchanged for a short-lived crates.io token, never a stored secret.
  # Runs after PyPI succeeds, so the two registries only ever hold the same
  # release. Pre-releases publish too (plan 00010 D1): the crate's first
  # version was the owner's manual bootstrap (plan 00009 D11), and every
  # version since, release candidates included, goes through this job, so the
  # Trusted Publishing path is exercised before a final release depends on it.
  publish-crate:
    needs: [quality, publish]
    runs-on: ubuntu-latest
    environment:
      name: crates-io
      url: https://crates.io/crates/fpr-ff1
    permissions:
      id-token: write # required for Trusted Publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: stable

      # Tags follow pyproject.toml's PEP 440 spelling (v2.1.0rc2) while the
      # crate carries the semver spelling (2.1.0-rc2). Map exactly one
      # pre-release suffix, -aN, -bN or -rcN, and nothing else, so any other
      # shape fails closed rather than publishing a version the tag does not
      # name.
      - name: Verify tag matches crate version
        run: |
          crate_version="$(grep -m1 '^version = ' rust/fpr-ff1/Cargo.toml | cut -d'"' -f2)"
          expected_tag="v$(printf '%s' "${crate_version}" | sed -E 's/-(a|b|rc)([0-9]+)$/\1\2/')"
          if [ "${GITHUB_REF_NAME}" != "${expected_tag}" ]; then
            echo "release tag ${GITHUB_REF_NAME} does not match crate version ${crate_version} (expected ${expected_tag})" >&2
            exit 1
          fi

      - name: Exchange the OIDC token for a crates.io token
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked -p fpr-ff1 --manifest-path rust/Cargo.toml
