name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Allows publish.yml to reuse this workflow as a release gate.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Turn a missing differential oracle into a hard failure.  Those tests are
  # the only coverage for radices without published NIST vectors, so a silent
  # skip would look exactly like a pass.
  FPR_FF1_REQUIRE_ORACLE: "1"

jobs:
  quality:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # --locked: lock drift fails the build rather than silently resolving.
      - name: Sync dependencies
        run: uv sync --locked --all-extras --dev --python ${{ matrix.python-version }}

      - name: Format check
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run pyright

      # FPR_FF1_REQUIRE_ORACLE (set at workflow level) makes a missing oracle
      # raise at collection time, so this run cannot pass with the
      # differential and interoperability suites silently skipped.  The
      # coverage flags are explicit here rather than in pyproject addopts so
      # a bare `pytest` from the sdist stays runnable for packagers; the
      # 100% floor is enforced on every CI test execution.
      - name: Test with 100% coverage gate
        run: uv run pytest --cov=fpr_ff1 --cov-report=term-missing --cov-fail-under=100

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      # Audit the locked environment: this is what CI and the release build
      # actually run against.  uv.lock is TOML, so export to requirements
      # format first; fpr-ff1 itself is omitted (unpublished local project,
      # nothing to audit).
      - name: Audit locked dependencies
        run: |
          uv export --frozen --no-hashes --no-emit-package fpr-ff1 --format requirements-txt -o requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt

      # Audit the declared minimum too: a floor that admits a known-vulnerable
      # release is a finding even when the lock resolves past it (review
      # 00004 MAJ-02).  pip-audit runs inside the minimum venv so it audits
      # that environment.
      - name: Audit declared minimum dependency set
        run: |
          uv venv minimum-check
          uv pip install --python minimum-check/bin/python "cryptography==50.0.0" pip-audit
          minimum-check/bin/pip-audit

      # Audit the locked Rust dependencies of the optional backend (plan
      # 00003 STEP-14, REQ-20): the compiled path's supply chain gets the
      # same treatment as the Python one. cargo-audit is version-pinned and
      # --locked so the audit tool itself cannot drift.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
      - name: Audit locked Rust dependencies
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --file rust/Cargo.lock

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Build
        run: uv build

      - name: Check metadata
        run: uvx twine check dist/*

      # The sdist contents are pinned by [tool.hatch.build.targets.sdist] in
      # pyproject.toml; this assertion fails the build if anything agent- or
      # editor-local (AGENTS.md, docs/plans, docs/reviews, .opencode,
      # .python-version) leaks back in (review 00003 L2 / review 00004
      # LOW-02).
      - name: Assert sdist contents
        run: |
          tar -tzf dist/*.tar.gz > sdist-contents.txt
          forbidden='AGENTS.md docs/plans/ docs/reviews/ .opencode/ .python-version .codegraph'
          for pattern in $forbidden; do
            if grep -q "$pattern" sdist-contents.txt; then
              echo "sdist contains forbidden path pattern: $pattern" >&2
              grep "$pattern" sdist-contents.txt | head -5 >&2
              exit 1
            fi
          done
          echo "sdist contents clean ($(wc -l < sdist-contents.txt) files)"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/

  wheel-build:
    name: Build platform wheels (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        # Decision D5 (plan 00003): abi3-py312 wheels for Linux x86_64 +
        # aarch64, macOS x86_64 + arm64, Windows x64. The pure-Python sdist
        # and py3-none-any wheel remain the universal fallback (REQ-19).
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      # SHA-pinned per the repository convention (review 00003 H4). The
      # toolchain channel itself is pinned by rust-toolchain.toml.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          targets: ${{ matrix.target }}

      # maturin reads [tool.maturin] from the root pyproject.toml (module
      # fpr_ff1._rs, python-source src, pyo3/abi3-py312) and produces the
      # mixed wheel: the full Python package plus the compiled extension,
      # tagged cp312-abi3 per platform. Version-pinned via uvx.
      - name: Build wheel
        run: >
          uvx maturin@1.15.0 build
          -m rust/fpr-ff1-rust/Cargo.toml
          --release --target ${{ matrix.target }}
          --out dist-wheels

      - name: Check wheel metadata
        run: uvx twine check dist-wheels/*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels
          path: dist-wheels/

  wheel-test:
    name: Test installed wheel
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      # Source-tree tests cannot catch packaging defects: a missing py.typed
      # or a bad packages entry would pass the whole matrix.  Install the
      # built wheel into a clean environment and exercise the public
      # surface from it (review 00003 M3 / review 00004 LOW-03).
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist/

      - name: Install wheel into a clean environment
        run: |
          uv venv wheel-check
          uv pip install --python wheel-check dist/*.whl

      - name: Exercise the installed package
        run: |
          wheel-check/bin/python - <<'EOF'
          import importlib.resources
          from importlib.metadata import version

          import fpr_ff1
          from fpr_ff1 import FF1

          # Every public symbol imports from the installed wheel.
          for name in fpr_ff1.__all__:
              assert getattr(fpr_ff1, name) is not None, name

          # The typed-package marker ships.
          assert importlib.resources.files("fpr_ff1").joinpath("py.typed").is_file()

          # The version matches the distribution.
          assert fpr_ff1.__version__ == version("fpr-ff1")

          # A NIST sample vector round-trips through the installed wheel.
          ff1 = FF1(
              key=bytes.fromhex("2b7e151628aed2a6abf7158809cf4f3c"),
              radix=10,
              alphabet="0123456789",
              tweak=bytes.fromhex("39383736353433323130"),
          )
          ciphertext = ff1.encrypt("0123456789")
          assert ff1.decrypt(ciphertext) == "0123456789"
          print("installed-wheel smoke test passed")
          EOF

  wheel-test-platform:
    name: Test installed platform wheel (both backends)
    runs-on: ubuntu-latest
    needs: wheel-build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      # The compiled platform wheel must be independently installable and
      # must reproduce the NIST vectors on BOTH backends (plan 00003
      # STEP-14, REQ-20): the pure-Python code and the extension ship in
      # one wheel, and the reference path must not depend on the extension.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheels
          path: dist-wheels/

      - name: Install the linux x86_64 wheel into a clean environment
        run: |
          uv venv wheel-check-rs
          uv pip install --python wheel-check-rs 'dist-wheels/*linux*x86_64*.whl'

      - name: Exercise both backends from the installed wheel
        run: |
          wheel-check-rs/bin/python - <<'EOF'
          import fpr_ff1._rs  # noqa: F401 -- the extension must be present
          from fpr_ff1 import FF1

          key = bytes.fromhex("2b7e151628aed2a6abf7158809cf4f3c")
          tweak = bytes.fromhex("39383736353433323130")
          py = FF1(key=key, radix=10, alphabet="0123456789", tweak=tweak)
          rs = FF1(key=key, radix=10, alphabet="0123456789", tweak=tweak, backend="rust")

          # NIST sample 2 (AES-128, radix 10, tweaked): both backends must
          # reproduce the published ciphertext exactly.
          expected = "6124200773"
          assert py.encrypt("0123456789") == expected, "python backend diverged"
          assert rs.encrypt("0123456789") == expected, "rust backend diverged"
          assert rs.decrypt(expected) == "0123456789"
          print("platform-wheel smoke test passed (both backends)")
          EOF

  sdist-test:
    name: Test sdist installs pure-Python (REQ-19)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      # REQ-19: the sdist is the universal fallback. It must install and
      # work WITHOUT the compiled extension -- hatchling builds it, no Rust
      # toolchain is invoked -- and backend="rust" must raise the
      # documented BackendError rather than an opaque ImportError.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist/

      - name: Install the sdist into a clean environment
        run: |
          uv venv sdist-check
          uv pip install --python sdist-check dist/*.tar.gz

      - name: Exercise the pure path and the BackendError contract
        run: |
          sdist-check/bin/python - <<'EOF'
          from fpr_ff1 import FF1, BackendError

          key = bytes.fromhex("2b7e151628aed2a6abf7158809cf4f3c")
          tweak = bytes.fromhex("39383736353433323130")
          ff1 = FF1(key=key, radix=10, alphabet="0123456789", tweak=tweak)
          assert ff1.encrypt("0123456789") == "6124200773"
          assert ff1.decrypt("6124200773") == "0123456789"

          try:
              FF1(key=bytes(16), radix=10, backend="rust")
          except BackendError:
              pass
          else:
              raise AssertionError("backend='rust' must raise BackendError without the extension")
          print("sdist smoke test passed (pure path + BackendError contract)")
          EOF

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    env:
      # Pinned so a scanner update cannot turn a release red without warning.
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The gitleaks CLI is used rather than gitleaks/gitleaks-action, which
      # rejects `release` events outright ("ERROR: The [release] event is not
      # yet supported").  publish.yml reuses this workflow as its release gate,
      # so the action failed there and blocked publishing.  The CLI has no
      # event restrictions and runs the same command as `just secrets`.
      #
      # The tarball is verified against the checksums file published with the
      # release before extraction: an unverified curl|tar in a workflow with
      # publish authority is a supply-chain exposure (review 00003 H4).
      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          filename="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$filename" "${base}/${filename}"
          curl -sSfL -o checksums.txt "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "$filename" checksums.txt > expected.sha256
          # sha256sum -c checks the filename embedded in the checksums line,
          # so the tarball must be stored under its canonical name.
          sha256sum -c expected.sha256
          tar -xzf "$filename" gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan for secrets
        run: gitleaks dir . --redact --exit-code 1