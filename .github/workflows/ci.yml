name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Allows publish.yml to reuse this workflow as a release gate.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Turn a missing differential oracle into a hard failure.  Those tests are
  # the only coverage for radices without published NIST vectors, so a silent
  # skip would look exactly like a pass.
  FPR_FF1_REQUIRE_ORACLE: "1"

jobs:
  quality:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # --locked: lock drift fails the build rather than silently resolving.
      - name: Sync dependencies
        run: uv sync --locked --all-extras --dev --python ${{ matrix.python-version }}

      - name: Format check
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run pyright

      # FPR_FF1_REQUIRE_ORACLE (set at workflow level) makes a missing oracle
      # raise at collection time, so this run cannot pass with the
      # differential and interoperability suites silently skipped.  The
      # coverage flags are explicit here rather than in pyproject addopts so
      # a bare `pytest` from the sdist stays runnable for packagers; the
      # 100% floor is enforced on every CI test execution.
      - name: Test with 100% coverage gate
        run: uv run pytest --cov=fpr_ff1 --cov-report=term-missing --cov-fail-under=100

  # Review 00006 MAJ-01: before this job the release gate never executed the
  # compiled backend's conformance suite. The matrix above runs 856 tests
  # with no extension present, and the only Rust execution anywhere in the
  # pipeline was a single NIST vector (d = 12) in the linux-only platform-wheel
  # smoke test that wheel-test-native has since replaced -- so a
  # bug reachable only at d > 16 would have shipped green.
  #
  # Three things make this job hard to fake:
  #   * FPR_FF1_REQUIRE_RUST_BACKEND turns a missing extension into a
  #     collection error, never a skip;
  #   * the `-k rust` floor fails if the dual-backend parameterisation ever
  #     collapses to the python leg alone;
  #   * the coverage gate still demands 100% with the extension in place.
  #
  # It deliberately does not `needs: quality` -- it is independent of the
  # matrix and runs beside it, so it adds nothing to the critical path.
  rust-conformance:
    name: Rust backend conformance (full suite, both backends)
    runs-on: ubuntu-latest
    env:
      # A missing extension is a hard failure here, never a skip.
      FPR_FF1_REQUIRE_RUST_BACKEND: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          # The action requires an explicit `toolchain` input; it does not
          # read rust-toolchain.toml (that file is consumed by rustup/cargo
          # themselves). Keep this in sync with the channel pin there.
          toolchain: stable

      - name: Sync dependencies
        run: uv sync --locked --all-extras --dev

      # These two steps are exactly what `just backend-dev` runs; `just` is
      # not installed on ubuntu-latest, so they are inlined. Keep the recipe
      # and these commands in sync -- the import check below fails fast if
      # they drift. PYO3_PYTHON must be absolute: cargo build scripts run
      # with the crate directory as cwd.
      - name: Build the compiled backend
        run: PYO3_PYTHON="$PWD/.venv/bin/python" cargo build --release --locked --manifest-path rust/Cargo.toml
      - name: Install it as fpr_ff1._rs
        run: cp rust/target/release/lib_fpr_ff1_rs.so src/fpr_ff1/_rs.so

      - name: Verify the extension imports
        run: uv run python -c "import fpr_ff1._rs as r; print('extension', r.__version__)"

      # A floor, not an exact count: an absolute number goes stale every time
      # anyone adds a parametrised case, but only a silent skip can push the
      # rust selection below 500 (it is 550 at the time of writing).
      - name: Assert the rust parameterisation is collected
        run: |
          n=$(uv run pytest --collect-only -q -k rust | tail -1 | grep -oE '^[0-9]+')
          echo "rust-parameterised tests collected: ${n:-0}"
          test "${n:-0}" -ge 500 || { echo "only ${n:-0} rust-parameterised tests collected" >&2; exit 1; }

      # FPR_FF1_REQUIRE_ORACLE comes from the workflow-level env.
      - name: Full suite on both backends with the 100% coverage gate
        run: uv run pytest --cov=fpr_ff1 --cov-report=term-missing --cov-fail-under=100

      - name: Rust unit tests
        run: cargo test --manifest-path rust/Cargo.toml

      # `just rust-lint` runs these two locally.
      - name: Rust format check
        run: cargo fmt --check --manifest-path rust/Cargo.toml
      - name: Rust lint
        run: cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      # Audit the locked environment: this is what CI and the release build
      # actually run against.  uv.lock is TOML, so export to requirements
      # format first; fpr-ff1 itself is omitted (unpublished local project,
      # nothing to audit).
      - name: Audit locked dependencies
        run: |
          uv export --frozen --no-hashes --no-emit-package fpr-ff1 --format requirements-txt -o requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt

      # Audit the declared minimum too: a floor that admits a known-vulnerable
      # release is a finding even when the lock resolves past it (review
      # 00004 MAJ-02).  pip-audit runs inside the minimum venv so it audits
      # that environment.
      - name: Audit declared minimum dependency set
        run: |
          uv venv minimum-check
          uv pip install --python minimum-check/bin/python "cryptography==50.0.0" pip-audit
          minimum-check/bin/pip-audit

      # Audit the locked Rust dependencies of the optional backend (plan
      # 00003 STEP-14, REQ-20): the compiled path's supply chain gets the
      # same treatment as the Python one. cargo-audit is version-pinned and
      # --locked so the audit tool itself cannot drift.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          # The action requires an explicit `toolchain` input; it does not
          # read rust-toolchain.toml (that file is consumed by rustup/cargo
          # themselves). Keep this in sync with the channel pin there.
          toolchain: stable
      - name: Audit locked Rust dependencies
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --file rust/Cargo.lock

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Build
        run: uv build

      - name: Check metadata
        run: uvx twine check dist/*

      # The sdist contents are pinned by [tool.hatch.build.targets.sdist] in
      # pyproject.toml; this assertion fails the build if anything agent- or
      # editor-local (AGENTS.md, docs/plans, docs/reviews, .opencode,
      # .python-version) leaks back in (review 00003 L2 / review 00004
      # LOW-02).
      - name: Assert sdist contents
        run: |
          tar -tzf dist/*.tar.gz > sdist-contents.txt
          forbidden='AGENTS.md CLAUDE.md docs/plans/ docs/reviews/ .opencode/ .python-version .codegraph'
          for pattern in $forbidden; do
            if grep -q "$pattern" sdist-contents.txt; then
              echo "sdist contains forbidden path pattern: $pattern" >&2
              grep "$pattern" sdist-contents.txt | head -5 >&2
              exit 1
            fi
          done
          echo "sdist contents clean ($(wc -l < sdist-contents.txt) files)"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/

  wheel-build:
    name: Build platform wheels (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        # Decision D5 (plan 00003): abi3-py312 wheels for Linux x86_64 +
        # aarch64, macOS x86_64 + arm64, Windows x64. The pure-Python sdist
        # and py3-none-any wheel remain the universal fallback (REQ-19).
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      # SHA-pinned per the repository convention (review 00003 H4). The
      # toolchain channel itself is pinned by rust-toolchain.toml.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          # The action requires an explicit `toolchain` input; it does not
          # read rust-toolchain.toml (that file is consumed by rustup/cargo
          # themselves). Keep this in sync with the channel pin there.
          toolchain: stable
          targets: ${{ matrix.target }}

      # maturin reads [tool.maturin] from the root pyproject.toml (module
      # fpr_ff1._rs, python-source src, pyo3/abi3-py312) and produces the
      # mixed wheel: the full Python package plus the compiled extension,
      # tagged cp312-abi3 per platform. Version-pinned via uvx.
      # The channel is pinned, not the release, so record the exact compiler
      # that produced each published wheel (review 00007 STABLE-10).
      - name: Record the Rust toolchain
        run: |
          rustc --version
          cargo --version

      # --locked: a manifest/lock mismatch fails the build instead of being
      # resolved silently, so the wheel is built from exactly the dependency
      # set cargo-audit checked (review 00007 STABLE-10).
      - name: Build wheel
        run: >
          uvx maturin@1.15.0 build
          -m rust/fpr-ff1-rust/Cargo.toml
          --release --locked --target ${{ matrix.target }}
          --out dist-wheels

      - name: Check wheel metadata
        run: uvx twine check dist-wheels/*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Unique per matrix leg: GitHub treats same-named artifacts as
          # versions of one artifact, so a shared name would collapse the
          # five platform wheels to a single (newest) one on download.
          name: wheels-${{ matrix.target }}
          path: dist-wheels/

  wheel-test:
    name: Test installed wheel
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      # Source-tree tests cannot catch packaging defects: a missing py.typed
      # or a bad packages entry would pass the whole matrix.  Install the
      # built wheel into a clean environment and exercise the public
      # surface from it (review 00003 M3 / review 00004 LOW-03).
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist/

      - name: Install wheel into a clean environment
        run: |
          uv venv wheel-check
          uv pip install --python wheel-check dist/*.whl

      - name: Exercise the installed package
        run: |
          wheel-check/bin/python - <<'EOF'
          import importlib.resources
          from importlib.metadata import version

          import fpr_ff1
          from fpr_ff1 import FF1

          # Every public symbol imports from the installed wheel.
          for name in fpr_ff1.__all__:
              assert getattr(fpr_ff1, name) is not None, name

          # The typed-package marker ships.
          assert importlib.resources.files("fpr_ff1").joinpath("py.typed").is_file()

          # The version matches the distribution.
          assert fpr_ff1.__version__ == version("fpr-ff1")

          # A NIST sample vector round-trips through the installed wheel.
          ff1 = FF1(
              key=bytes.fromhex("2b7e151628aed2a6abf7158809cf4f3c"),
              radix=10,
              alphabet="0123456789",
              tweak=bytes.fromhex("39383736353433323130"),
          )
          ciphertext = ff1.encrypt("0123456789")
          assert ff1.decrypt(ciphertext) == "0123456789"
          print("installed-wheel smoke test passed")
          EOF

  # Every published native wheel is installed and exercised on a runner that
  # can load it, on every supported CPython (plan 00007 STEP-06; review 00007
  # MED-02). Before this job only the linux x86_64 wheel was ever imported;
  # the other four were built, uploaded and published untested.
  #
  # The environment is built from the wheel artifact alone: a fresh venv, the
  # locked dev requirements exported WITHOUT the project, and the one wheel.
  # Never `uv sync` or `uv run` here -- either installs the editable checkout
  # over the wheel, and the job would test src/ while looking green. The
  # import-origin step is what proves it did not. Pytest runs from the
  # checkout only so the test files and vectors are present; src/ is not on
  # sys.path (no pytest `pythonpath` setting).
  wheel-test-native:
    name: Installed wheel (${{ matrix.target }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    needs: wheel-build
    env:
      FPR_FF1_REQUIRE_RUST_BACKEND: "1"
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - aarch64-apple-darwin
          - x86_64-apple-darwin
          - x86_64-pc-windows-msvc
        # Native runners only: each wheel is loaded by an interpreter of its
        # own architecture. macos-15-intel is the Intel macOS label (the
        # x86_64 wheel is cross-built on arm64 in wheel-build and was never
        # executed before this job).
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheels-${{ matrix.target }}
          path: dist-wheels/

      # `uv venv` does not download an interpreter for a `+gil` request, so
      # install it first (as the quality matrix does). `uv python install`
      # installs the default GIL-enabled build; `+gil` then keeps the venv
      # off any free-threaded interpreter on the runner, which cannot load
      # an abi3 wheel.
      - name: Install the wheel into a clean environment
        run: |
          uv python install "${{ matrix.python-version }}"
          uv venv wheel-venv --python "${{ matrix.python-version }}+gil"
          uv export --frozen --no-emit-project --no-hashes -o requirements-ci.txt
          uv pip install --python wheel-venv -r requirements-ci.txt dist-wheels/*.whl
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "VENV_PY=wheel-venv/Scripts/python.exe" >> "$GITHUB_ENV"
          else
            echo "VENV_PY=wheel-venv/bin/python" >> "$GITHUB_ENV"
          fi

      - name: Assert imports resolve to the installed wheel
        run: '"$VENV_PY" .github/scripts/assert_installed_wheel.py'

      # NIST vectors both directions, per-round intermediates, the AES KAT and
      # PRF equality, frozen KATs (including d > 16), typed errors and backend
      # dispatch, pickling and the distribution version, smoke. Both backends
      # run in each module; FPR_FF1_REQUIRE_ORACLE comes from the workflow env.
      - name: Installed-package conformance subset (both backends)
        run: >
          "$VENV_PY" -m pytest -p no:cacheprovider -q
          tests/test_nist_vectors.py
          tests/test_intermediates.py
          tests/test_rust_aes_validation.py
          tests/test_frozen_kat.py
          tests/test_backend_dispatch.py
          tests/test_pickle.py
          tests/test_smoke.py

  # The FULL suite against an abi3 distribution build (plan 00007 STEP-06;
  # review 00007 MED-02). rust-conformance runs the suite on a plain `cargo
  # build` of the source tree, which is not the pyo3/abi3-py312 configuration
  # that ships. This leg installs the published linux x86_64 wheel exactly as
  # wheel-test-native does and holds it to rust-conformance's bar: required
  # backend and oracle, the -k rust floor, and 100% coverage -- measured on
  # the installed package. Python 3.14 is the newest interpreter the abi3
  # wheel serves and one the source-tree job never uses.
  wheel-conformance-abi3:
    name: Full conformance on the installed abi3 wheel (linux x86_64, py3.14)
    runs-on: ubuntu-24.04
    needs: wheel-build
    env:
      FPR_FF1_REQUIRE_RUST_BACKEND: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheels-x86_64-unknown-linux-gnu
          path: dist-wheels/

      - name: Install the wheel into a clean environment
        run: |
          uv python install 3.14
          uv venv wheel-venv --python "3.14+gil"
          uv export --frozen --no-emit-project --no-hashes -o requirements-ci.txt
          uv pip install --python wheel-venv -r requirements-ci.txt dist-wheels/*.whl

      - name: Assert imports resolve to the installed wheel
        run: wheel-venv/bin/python .github/scripts/assert_installed_wheel.py

      - name: Assert the rust parameterisation is collected
        run: |
          n=$(wheel-venv/bin/python -m pytest -p no:cacheprovider --collect-only -q -k rust | tail -1 | grep -oE '^[0-9]+')
          echo "rust-parameterised tests collected: ${n:-0}"
          test "${n:-0}" -ge 500 || { echo "only ${n:-0} rust-parameterised tests collected" >&2; exit 1; }

      - name: Full suite on both backends with the 100% coverage gate
        run: >
          wheel-venv/bin/python -m pytest -p no:cacheprovider
          --cov=fpr_ff1 --cov-report=term-missing --cov-fail-under=100

  sdist-test:
    name: Test sdist installs pure-Python (REQ-19)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      # REQ-19: the sdist is the universal fallback. It must install and
      # work WITHOUT the compiled extension -- hatchling builds it, no Rust
      # toolchain is invoked -- and backend="rust" must raise the
      # documented BackendError rather than an opaque ImportError.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist/

      - name: Install the sdist into a clean environment
        run: |
          uv venv sdist-check
          uv pip install --python sdist-check dist/*.tar.gz

      - name: Exercise the pure path and the BackendError contract
        run: |
          sdist-check/bin/python - <<'EOF'
          from fpr_ff1 import FF1, BackendError

          key = bytes.fromhex("2b7e151628aed2a6abf7158809cf4f3c")
          tweak = bytes.fromhex("39383736353433323130")
          ff1 = FF1(key=key, radix=10, alphabet="0123456789", tweak=tweak)
          assert ff1.encrypt("0123456789") == "6124200773"
          assert ff1.decrypt("6124200773") == "0123456789"

          try:
              FF1(key=bytes(16), radix=10, backend="rust")
          except BackendError:
              pass
          else:
              raise AssertionError("backend='rust' must raise BackendError without the extension")
          print("sdist smoke test passed (pure path + BackendError contract)")
          EOF

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    env:
      # Pinned so a scanner update cannot turn a release red without warning.
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The gitleaks CLI is used rather than gitleaks/gitleaks-action, which
      # rejects `release` events outright ("ERROR: The [release] event is not
      # yet supported").  publish.yml reuses this workflow as its release gate,
      # so the action failed there and blocked publishing.  The CLI has no
      # event restrictions and runs the same command as `just secrets`.
      #
      # The tarball is verified against the checksums file published with the
      # release before extraction: an unverified curl|tar in a workflow with
      # publish authority is a supply-chain exposure (review 00003 H4).
      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          filename="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$filename" "${base}/${filename}"
          curl -sSfL -o checksums.txt "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "$filename" checksums.txt > expected.sha256
          # sha256sum -c checks the filename embedded in the checksums line,
          # so the tarball must be stored under its canonical name.
          sha256sum -c expected.sha256
          tar -xzf "$filename" gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan for secrets
        run: gitleaks dir . --redact --exit-code 1