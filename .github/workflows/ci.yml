name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Allows publish.yml to reuse this workflow as a release gate.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Turn a missing differential oracle into a hard failure.  Those tests are
  # the only coverage for radices without published NIST vectors, so a silent
  # skip would look exactly like a pass.
  FPR_FF1_REQUIRE_ORACLE: "1"

jobs:
  quality:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@11bd5960a326750d5838078e36cf38b85af677262 # v4.3.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # --locked: lock drift fails the build rather than silently resolving.
      - name: Sync dependencies
        run: uv sync --locked --all-extras --dev --python ${{ matrix.python-version }}

      - name: Format check
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run pyright

      # FPR_FF1_REQUIRE_ORACLE (set at workflow level) makes a missing oracle
      # raise at collection time, so this run cannot pass with the
      # differential and interoperability suites silently skipped.  The
      # coverage flags are explicit here rather than in pyproject addopts so
      # a bare `pytest` from the sdist stays runnable for packagers; the
      # 100% floor is enforced on every CI test execution.
      - name: Test with 100% coverage gate
        run: uv run pytest --cov=fpr_ff1 --cov-report=term-missing --cov-fail-under=100

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd5960a326750d5838078e36cf38b85af677262 # v4.3.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      # Audit the locked environment: this is what CI and the release build
      # actually run against.  pip-audit reads uv.lock natively.
      - name: Audit locked dependencies
        run: uvx pip-audit -r uv.lock

      # Audit the declared minimum too: a floor that admits a known-vulnerable
      # release is a finding even when the lock resolves past it (review
      # 00004 MAJ-02).
      - name: Audit declared minimum dependency set
        run: |
          uv venv minimum-check
          uv pip install --python minimum-check "fpr-ff1 @ ." "cryptography==50.0.0"
          uvx pip-audit --python minimum-check/bin/python

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@11bd5960a326750d5838078e36cf38b85af677262 # v4.3.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      - name: Build
        run: uv build

      - name: Check metadata
        run: uvx twine check dist/*

      # The sdist contents are pinned by [tool.hatch.build.targets.sdist] in
      # pyproject.toml; this assertion fails the build if anything agent- or
      # editor-local (AGENTS.md, docs/plans, docs/reviews, .opencode,
      # .python-version) leaks back in (review 00003 L2 / review 00004
      # LOW-02).
      - name: Assert sdist contents
        run: |
          tar -tzf dist/*.tar.gz > sdist-contents.txt
          forbidden='AGENTS.md docs/plans/ docs/reviews/ .opencode/ .python-version .codegraph'
          for pattern in $forbidden; do
            if grep -q "$pattern" sdist-contents.txt; then
              echo "sdist contains forbidden path pattern: $pattern" >&2
              grep "$pattern" sdist-contents.txt | head -5 >&2
              exit 1
            fi
          done
          echo "sdist contents clean ($(wc -l < sdist-contents.txt) files)"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: distributions
          path: dist/

  wheel-test:
    name: Test installed wheel
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@11bd5960a326750d5838078e36cf38b85af677262 # v4.3.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      # Source-tree tests cannot catch packaging defects: a missing py.typed
      # or a bad packages entry would pass the whole matrix.  Install the
      # built wheel into a clean environment and exercise the public
      # surface from it (review 00003 M3 / review 00004 LOW-03).
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: distributions
          path: dist/

      - name: Install wheel into a clean environment
        run: |
          uv venv wheel-check
          uv pip install --python wheel-check dist/*.whl

      - name: Exercise the installed package
        run: |
          wheel-check/bin/python - <<'EOF'
          import importlib.resources
          from importlib.metadata import version

          import fpr_ff1
          from fpr_ff1 import FF1

          # Every public symbol imports from the installed wheel.
          for name in fpr_ff1.__all__:
              assert getattr(fpr_ff1, name) is not None, name

          # The typed-package marker ships.
          assert importlib.resources.files("fpr_ff1").joinpath("py.typed").is_file()

          # The version matches the distribution.
          assert fpr_ff1.__version__ == version("fpr-ff1")

          # A NIST sample vector round-trips through the installed wheel.
          ff1 = FF1(
              key=bytes.fromhex("2b7e151628aed2a6abf7158809cf4f3c"),
              radix=10,
              alphabet="0123456789",
              tweak=bytes.fromhex("39383736353433323130"),
          )
          ciphertext = ff1.encrypt("0123456789")
          assert ff1.decrypt(ciphertext) == "0123456789"
          print("installed-wheel smoke test passed")
          EOF

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    env:
      # Pinned so a scanner update cannot turn a release red without warning.
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@11bd5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          fetch-depth: 0

      # The gitleaks CLI is used rather than gitleaks/gitleaks-action, which
      # rejects `release` events outright ("ERROR: The [release] event is not
      # yet supported").  publish.yml reuses this workflow as its release gate,
      # so the action failed there and blocked publishing.  The CLI has no
      # event restrictions and runs the same command as `just secrets`.
      #
      # The tarball is verified against the checksums file published with the
      # release before extraction: an unverified curl|tar in a workflow with
      # publish authority is a supply-chain exposure (review 00003 H4).
      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL -o gitleaks.tar.gz \
            "${base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o checksums.txt "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" checksums.txt > expected.sha256
          sha256sum -c expected.sha256
          tar -xz -C /tmp gitleaks.tar.gz
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan for secrets
        run: gitleaks dir . --redact --exit-code 1